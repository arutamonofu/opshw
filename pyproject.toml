[project]
name = "opshw"
version = "0.1.0"
description = "Homework"
readme = "README.md"
authors = [
    { name = "Aleksandr Artamonov", email = "artamonov@pish.itmo.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[project.scripts]
opshw = "opshw:main"
opshw-train = "opshw.train:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = [
    "smoke: quick smoke test for pipeline sanity",
]

